[package]
name = "coupler"
version = "0.1.0"
edition = "2021"
authors = ["Aneesh Krishna Parthasarathy <aneeshkrishnaparthasarathy@gmail.com>"]
description = "A hardware-aware OpenQASM 3.0 execution engine, fault-tolerant surface code scheduler, and transmon pulse calibration pipeline"
license = "Apache-2.0"

[dependencies]
rhai = { version = "1.27.0", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "coupler"
path = "src/lib.rs"

[[bin]]
name = "coupler"
path = "src/main.rs"
